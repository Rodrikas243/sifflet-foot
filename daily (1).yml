name: Sifflet quotidien

on:
  schedule:
    - cron: "0 7 * * *"     # matin (UTC) : publier les fiches
    - cron: "30 23 * * *"   # soir (UTC) : enregistrer les scores
  workflow_dispatch:
    inputs:
      task:
        description: "Tâche à lancer"
        type: choice
        options: [publish, settle]
        default: publish

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sifflet
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Choisir la tâche
        id: task
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            T="${{ inputs.task }}"
          elif [ "${{ github.event.schedule }}" = "0 7 * * *" ]; then
            T=publish
          else
            T=settle
          fi
          echo "task=$T" >> "$GITHUB_OUTPUT"

      - name: Télécharger les CSV (saison en cours + 3 précédentes)
        run: |
          Y=$(date -u +%Y); M=$(date -u +%m)
          if [ "$M" -ge 7 ]; then START=$Y; else START=$((Y - 1)); fi
          for K in 0 1 2 3; do
            A=$((START - K)); B=$((A + 1))
            S=$(printf "%02d%02d" $((A % 100)) $((B % 100)))
            curl -fsSL "https://www.football-data.co.uk/mmz4281/$S/E0.csv" -o "E0_$S.csv" \
              || echo "CSV de la saison $S indisponible."
          done
          ls E0_*.csv

      - name: Lancer la tâche
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          HISTORY_GLOB: "E0_*.csv"
        run: python sifflet.py ${{ steps.task.outputs.task }}

      - name: Générer le site
        run: python sifflet.py build

      - name: Sauvegarder le journal dans le dépôt
        run: |
          git config user.name "sifflet-bot"
          git config user.email "sifflet-bot@users.noreply.github.com"
          git add journal.db
          git commit -m "Journal du $(date -u +%F) (${{ steps.task.outputs.task }})" || echo "Rien de nouveau."
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
